# Match editor copy/paste shortcuts while retaining Ctrl+C to interrupt
# when no text is selected. Tab completion is unaffected.
map ctrl+c copy_or_interrupt
# Let terminal apps handle image attachments; paste text through Kitty.
map ctrl+v kitten clipboard_paste.py

# Neutral glass: the wallpaper supplies the color through the background.
# Text stays opaque; avoid compositor window-opacity rules that fade glyphs.
background #080808
foreground #ffffff
background_opacity 0.58
dynamic_background_opacity yes
# Request frosted glass where supported; Hyprland also supplies desktop blur.
background_blur 24
# Keep faint application text readable through the transparent background.
dim_opacity 0.95
