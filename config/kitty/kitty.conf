# Match editor copy/paste shortcuts while retaining Ctrl+C to interrupt
# when no text is selected. Tab completion is unaffected.
map ctrl+c copy_or_interrupt
# Let terminal apps handle image attachments; paste text through Kitty.
map ctrl+v kitten clipboard_paste.py

# Wallpaper glass: cool sea/sky tones with warm sunset accents.
# Only the background is translucent; foreground text stays fully opaque.
background #172333
foreground #f2f6fc
background_opacity 0.82
dynamic_background_opacity yes
# Keep applications' faint text readable over the wallpaper, too.
dim_opacity 0.8

cursor #ffd2b0
cursor_text_color #172333
selection_background #abcbea
selection_foreground #172333
url_color #9eddf0

# Readable ANSI accents for commands, diagnostics, and directory listings.
color0  #263449
color1  #ffb1ae
color2  #b4ddac
color3  #f4d6a0
color4  #a3c8ff
color5  #d5bef3
color6  #9eddf0
color7  #dce6f2
color8  #afc0d6
color9  #ffc3ba
color10 #c5ebbc
color11 #ffe4b8
color12 #bddaff
color13 #e4cffa
color14 #b6ecf5
color15 #f2f6fc
