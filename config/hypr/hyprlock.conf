# Hyprshell: a spacious clock and soft surfaces inspired by Sidera.
# Authentication and session-lock recovery remain managed by Hyprlock.
$hyprshell_lock_overlay = rgba(1e1e2e26)
$hyprshell_lock_field = rgba(313244a8)
general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.34, 0.8, 0.34, 1
    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = screenshot
    color = rgb(1e1e2e)
    blur_passes = 2
    brightness = 1.0
}

# Adjustable tint over the screenshot; all foreground widgets sit above it.
shape {
    monitor =
    size = 100%, 100%
    rounding = 0
    color = $hyprshell_lock_overlay
    zindex = 0
}

label {
    zindex = 1
    monitor =
    text = $TIME
    color = rgb(cba6f7)
    font_family = Noto Sans
    font_size = 100
    position = 0, 190
    halign = center
    valign = center
}

label {
    zindex = 1
    monitor =
    text = cmd[update:60000] date +"%A • %d %B"
    color = rgb(cdd6f4)
    font_family = Noto Sans
    font_size = 18
    position = 0, 100
    halign = center
    valign = center
}

shape {
    monitor =
    size = 76, 76
    rounding = -1
    color = rgba(31324480)
    border_size = 2
    border_color = rgb(b4befe)
    position = 0, 20
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 18, 18
    rounding = -1
    color = rgb(b4befe)
    position = 0, 36
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 44, 26
    rounding = 13
    color = rgb(b4befe)
    position = 0, 7
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    zindex = 1
    color = rgb(cdd6f4)
    font_family = Noto Sans
    font_size = 18
    position = 0, -45
    halign = center
    valign = center
}

input-field {
    zindex = 1
    monitor =
    size = 320, 56
    position = 0, -115
    halign = center
    valign = center
    rounding = 28
    outline_thickness = 2
    outer_color = rgb(b4befe)
    inner_color = $hyprshell_lock_field
    font_color = rgb(cdd6f4)
    font_family = Noto Sans
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    placeholder_text = Enter your password
    fail_text = Authentication failed ($ATTEMPTS)
    fade_on_empty = false
}

label {
    monitor =
    text = Press Enter to unlock · Your apps are still open
    zindex = 1
    color = rgb(bac2de)
    font_family = Noto Sans
    font_size = 11
    position = 0, -180
    halign = center
    valign = center
}
