# Hyprshell Glass: matches the login screen while preserving the session.
general {
    hide_cursor = true
}

background {
    monitor =
    path = ./lock-assets/background.png
    color = rgb(0b101a)
    blur_passes = 0
}

image {
    monitor =
    path = ./lock-assets/card.png
    size = 500
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgb(edf0ff)
    font_family = Noto Sans
    font_size = 18
    position = 0, 40
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 280, 44
    position = 0, -20
    halign = center
    valign = center
    rounding = 12
    outline_thickness = 2
    outer_color = rgb(b4befe)
    inner_color = rgba(101b2ae6)
    font_color = rgb(edf0ff)
    font_family = Noto Sans
    check_color = rgb(89dceb)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    placeholder_text = Enter your password
    fail_text = Authentication failed ($ATTEMPTS)
    fade_on_empty = false
    zindex = 1
}

label {
    monitor =
    text = Press Enter to unlock · Your apps are still open
    color = rgb(adb8d0)
    font_family = Noto Sans
    font_size = 11
    position = 0, -88
    halign = center
    valign = center
    zindex = 1
}
