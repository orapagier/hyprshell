[package]
name = "hyprmonitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "An event-driven, native Wayland desktop system monitor"
license = "MIT"

[dependencies]
calloop = "0.13"
calloop-wayland-source = "0.3"
fontdue = "0.9"
libc = "0.2"
rustix = { version = "0.38", features = ["fs", "param", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
tiny-skia = "0.11"
toml = "0.8"
wayland-client = "0.31"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
zbus = "4.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
